<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>História da Filosofia | Linha do Tempo</title>
    
    <!-- Tipografia Clássica e Moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container do p5.js fixado ao fundo -->
    <div id="canvas-container"></div>

    <!-- Wrapper principal para o Lenis Scroll -->
    <main id="app">
        
        <!-- Seção Hero -->
        <section class="hero">
            <div class="hero-content">
                <h1>História da Filosofia</h1>
                <p class="subtitle">Do Pensamento Mitológico à Razão Contemporânea</p>
                <div class="scroll-indicator">
                    <div class="line"></div>
                </div>
            </div>
        </section>

        <!-- Container onde o JSON será injetado -->
        <section id="timeline-container">
            <!-- Os períodos e filósofos serão renderizados aqui via JS -->
            <div style="height: 100vh;"></div> <!-- Placeholder temporário para teste de scroll -->
        </section>

    </main>

    <!-- Bibliotecas Externas (CDNs) -->
    <!-- 1. GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <!-- 2. Lenis (Smooth Scroll) -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <!-- 3. p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

    <!-- Scripts da Aplicação -->
    <script src="sketch.js"></script> <!-- Lógica do p5.js -->
    <script src="main.js"></script>   <!-- Lógica principal (Lenis, GSAP, Fetch API) -->
</body>
</html>
